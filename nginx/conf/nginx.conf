
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"'
		      'upstream_addr: $upstream_addr';

    #access_log  logs/access.log  main;
    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # upstream模块：server_group_name 自定义服务组名
    upstream  my_llm_server {
	# server指令指定后端服务器的IP地址和端口
	## server    192.168.11.37:8080;
	## server    192.168.11.65:8081 down;
	server    192.168.11.37:18093 max_fails=3  fail_timeout=20s;
	server    192.168.11.65:18083 max_fails=3  fail_timeout=20s;
	}

    server {
	# 监听端口 (对外暴露的端口)
        listen       80;
        server_name  localhost; # 或者填写你的域名


	# 允许较大的请求体 (防止长 Prompt 被截断)
        client_max_body_size 20M;
        
        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
	    # 转发到后端集群
            # proxy_pass：代理转发，将单体服务http://127.0.0.1:80，改为服务组名
            proxy_pass http://my_llm_server/;
            proxy_redirect default;
            # 增加下面内容, 如果遇到 nginx 配置了https upstream，然后访问跳转失败，直接报404。
            proxy_set_header    Host    $host;
            proxy_set_header    X-Real-IP    $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;


	    # --- vLLM 关键配置 ---

            # 1. 关闭缓冲：必须！否则流式输出 (Streaming) 会失效
            proxy_buffering off;
            proxy_cache off;

            # 2. 设置超时：必须！防止生成长文本时断开 (504 错误)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 3. HTTP 协议版本：必须 1.1 以支持 Keep-Alive
            proxy_http_version 1.1;

            # 4. 连接头设置
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 5. 支持 SSE (Server-Sent Events)
            chunked_transfer_encoding off;

        }

        # location / {
        #     root   html;
        #     index  index.html index.htm;
        # }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
